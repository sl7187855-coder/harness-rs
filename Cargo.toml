[package]
name = "harness-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
cordis-rs = "0.11"
axum = { version = "0.8", features = ["json", "http1", "tokio", "multipart"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
httpdate = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
async-stream = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
ignore = "0.4"
libc = "0.2"
globset = "0.4"
regex = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 0
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
